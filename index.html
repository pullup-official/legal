<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULLUP 說明文件</title>
<style>
:root {
  --bg: #0b0b12;
  --card: #15151d;
  --text: #ececf1;
  --muted: #a0a0ad;
  --line: #2a2a35;
  --accent: #c9a0ff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px;
  line-height: 1.8;
}
main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
.brand { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 3px; text-decoration: none; }
h1 { font-size: 28px; line-height: 1.3; margin: 12px 0 4px; }
.updated { color: var(--muted); font-size: 13px; margin: 0 0 32px; }
h2 { font-size: 19px; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 24px 0 4px; color: var(--accent); }
p, li { color: var(--text); }
ul { padding-left: 1.2em; margin: 8px 0; }
li { margin: 4px 0; }
.note { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 15px; }
a { color: var(--accent); }
.links { display: grid; gap: 12px; margin-top: 24px; }
.links a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--text); font-weight: 700; }
.links a span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="index.html">PULLUP</a>
  <h1>說明文件</h1>
  <p class="updated">有任何問題，寫信到 <a href="mailto:pullup.app.support@gmail.com">pullup.app.support@gmail.com</a></p>
  <div class="links">
    <a href="privacy.html">隱私權政策<span>我們收集哪些資料、怎麼使用、怎麼刪除</span></a>
    <a href="terms.html">服務條款與社群守則<span>使用 PULLUP 的規則，以及違規的處理方式</span></a>
    <a href="delete-account.html">刪除帳號<span>在 app 裡刪除，或寫信請我們協助刪除</span></a>
  </div>
  <footer>© PULLUP 團隊</footer>
</main>
</body>
</html>
